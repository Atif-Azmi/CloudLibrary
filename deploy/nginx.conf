# Optional Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/library and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;

    client_max_body_size 16M;

    # Forward ALB traffic directly to Gunicorn WSGI server
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve static assets directly for high performance
    location /static/ {
        alias /home/ubuntu/library-system/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
