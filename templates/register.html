{% extends 'base.html' %}
{% block title %}Register Student{% endblock %}

{% block content %}
<div class="auth-card-wrapper">
    <div class="neo-card auth-card-wide">
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="neo-stat-icon-wrapper" style="width: 52px; height: 52px; margin: 0 auto 1rem auto; font-size: 1.35rem;">
                <i class="bi bi-person-plus"></i>
            </div>
            <h2 class="font-heading" style="font-size: clamp(1.25rem, 3.5vw, 1.55rem); margin-bottom: 0.35rem; line-height: 1.3;">
                Create student account
            </h2>
            <p class="text-secondary small" style="margin-bottom: 0;">
                Register to browse textbook collections and manage your borrowings.
            </p>
        </div>

        <!-- Registration Form -->
        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="neo-input-wrapper">
                <label for="full_name" class="neo-label">Full name</label>
                <input type="text" class="neo-input" id="full_name" name="full_name" required
                       placeholder="e.g. John Doe">
            </div>

            <div class="form-grid-2">
                <div class="neo-input-wrapper">
                    <label for="username" class="neo-label">Username</label>
                    <input type="text" class="neo-input" id="username" name="username" required
                           placeholder="e.g. jdoe24">
                </div>
                <div class="neo-input-wrapper">
                    <label for="email" class="neo-label">College email</label>
                    <input type="email" class="neo-input" id="email" name="email" required
                           placeholder="e.g. jdoe@college.edu">
                </div>
            </div>

            <div class="form-grid-2">
                <div class="neo-input-wrapper">
                    <label for="password" class="neo-label">Password</label>
                    <input type="password" class="neo-input" id="password" name="password" required
                           placeholder="Min. 6 characters">
                </div>
                <div class="neo-input-wrapper">
                    <label for="confirm_password" class="neo-label">Confirm password</label>
                    <input type="password" class="neo-input" id="confirm_password" name="confirm_password" required
                           placeholder="Re-enter password">
                </div>
            </div>

            <!-- Borrowing Rules Reminder -->
            <div class="neo-card-inset mb-4" style="padding: 0.85rem 1.15rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;" class="small text-secondary">
                    <i class="bi bi-info-circle-fill" style="color: var(--accent-blue); flex-shrink: 0;"></i>
                    <span>Fixed loan period: <strong>14 days</strong> &bull; Overdue rate: <strong>Rs 5.00/day</strong></span>
                </div>
            </div>

            <button type="submit" class="btn-neo-primary w-100" style="min-height: 48px; margin-bottom: 1.25rem;">
                <i class="bi bi-person-check"></i> Complete registration
            </button>

            <div style="text-align: center; font-size: 0.85rem;" class="text-secondary">
                Already registered?
                <a href="{{ url_for('login') }}" class="fw-bold" style="text-decoration: underline; color: var(--text-primary);">Sign in here</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
