{% extends 'base.html' %}
{% block title %}Add New Book - Admin{% endblock %}

{% block content %}
<div class="form-card-wrapper">
    <div class="neo-card form-card">
        <!-- Header -->
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid rgba(255, 255, 255, 0.6);">
            <div>
                <h3 class="font-heading mb-1" style="font-size: clamp(1.25rem, 3vw, 1.55rem);">Add new textbook</h3>
                <p class="text-secondary small mb-0">Publish a new title into the library collection.</p>
            </div>
            <a href="{{ url_for('admin_books') }}" class="btn-neo-secondary small">
                <i class="bi bi-arrow-left"></i> Back to inventory
            </a>
        </div>

        <!-- Add Book Form -->
        <form method="POST" action="{{ url_for('admin_add_book') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="neo-input-wrapper">
                <label for="title" class="neo-label">Book title <span style="color: var(--accent-red);">*</span></label>
                <input type="text" class="neo-input" id="title" name="title" required
                       placeholder="e.g. Distributed Systems: Principles and Paradigms">
            </div>

            <div class="neo-input-wrapper">
                <label for="author" class="neo-label">Author(s) <span style="color: var(--accent-red);">*</span></label>
                <input type="text" class="neo-input" id="author" name="author" required
                       placeholder="e.g. Andrew S. Tanenbaum, Maarten van Steen">
            </div>

            <div class="form-grid-2">
                <div class="neo-input-wrapper">
                    <label for="isbn" class="neo-label">ISBN <span style="color: var(--accent-red);">*</span></label>
                    <input type="text" class="neo-input" id="isbn" name="isbn" required
                           placeholder="e.g. 978-1543057386">
                </div>
                <div class="neo-input-wrapper">
                    <label for="category" class="neo-label">Category / Subject <span style="color: var(--accent-red);">*</span></label>
                    <input type="text" class="neo-input" id="category" name="category" required
                           placeholder="e.g. Cloud Computing" list="category-suggestions">
                    <datalist id="category-suggestions">
                        <option value="Cloud Computing">
                        <option value="Software Engineering">
                        <option value="Database Systems">
                        <option value="Computer Networks">
                        <option value="Operating Systems">
                        <option value="Algorithms">
                        <option value="Artificial Intelligence">
                        <option value="DevOps & Cloud">
                    </datalist>
                </div>
            </div>

            <div class="neo-input-wrapper mb-4">
                <label for="total_copies" class="neo-label">Total inventory copies <span style="color: var(--accent-red);">*</span></label>
                <input type="number" class="neo-input" id="total_copies" name="total_copies" min="1" value="5" required>
                <small class="text-secondary" style="margin-left: 0.75rem; display: block; margin-top: 0.35rem;">
                    Available copies will automatically be set equal to total copies.
                </small>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn-neo-primary" style="padding: 0.75rem 1.75rem;">
                    <i class="bi bi-check2"></i> Publish book
                </button>
                <a href="{{ url_for('admin_books') }}" class="btn-neo-secondary small">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
