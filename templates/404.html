{% extends 'base.html' %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="auth-card-wrapper">
    <div class="neo-card auth-card" style="text-align: center; padding: 3rem 2rem;">
        <div class="font-heading mb-2" style="font-size: clamp(3rem, 8vw, 4.5rem); color: var(--surface-dark); line-height: 1;">404</div>
        <h3 class="font-heading mb-2" style="font-size: clamp(1.25rem, 3vw, 1.6rem);">Page not found</h3>
        <p class="text-secondary small mb-4">
            The requested page does not exist on this library server.
            Please check the URL or return to the main textbook catalog.
        </p>
        <div>
            <a href="{{ url_for('index') }}" class="btn-neo-primary">
                <i class="bi bi-house-door"></i> Back to catalog
            </a>
        </div>
    </div>
</div>
{% endblock %}
